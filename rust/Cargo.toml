[package]
name = "nighty_rs"
version = "0.1.0"
edition = "2021"
description = "Tree search for NightyBot's RL engine: the per-simulation work of rl_mcts.py, in Rust"

[lib]
name = "nighty_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
numpy = "0.23"
shakmaty = "0.27"
rayon = "1"
rand = "0.8"
rand_distr = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
